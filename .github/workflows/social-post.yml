name: Daily Social Card

# Renders the "Marquee Games" card and posts it so it lands ~9:35 AM Eastern (the
# job runs ~9:30 and schedules 5 minutes ahead). GitHub cron is UTC and ignores DST,
# so we fire at both the EDT and EST offsets, plus two later backup firings in case
# GitHub delays or drops the morning run. A per-day marker (.last_post_date) means
# only the first successful firing each day posts -- it can never double-post.

on:
  schedule:
    - cron: "30 13 * * *"   # 9:30 AM EDT (summer)
    - cron: "30 14 * * *"   # 9:30 AM EST (winter)
    - cron: "30 16 * * *"   # backup (~12:30 PM ET)
    - cron: "30 18 * * *"   # backup (~2:30 PM ET)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Post once per day, on/after 9 AM ET (manual runs always proceed)
        id: guard
        run: |
          TODAY=$(TZ="America/New_York" date +%F)
          NOWET=$(TZ="America/New_York" date +%H%M)
          LAST=$(cat .last_post_date 2>/dev/null || echo none)
          echo "Eastern now: $(TZ=America/New_York date '+%Y-%m-%d %H:%M')  |  last posted: $LAST"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          elif [ "$TODAY" != "$LAST" ] && [ "$NOWET" -ge "0900" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "Before 9 AM ET or already posted today - skipping this firing."
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.run == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        if: steps.guard.outputs.run == 'yes'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Render the card
        if: steps.guard.outputs.run == 'yes'
        run: python render_card.py

      - name: Commit the image so it has a public URL
        if: steps.guard.outputs.run == 'yes'
        run: |
          git config user.name "bannerman-bot"
          git config user.email "actions@users.noreply.github.com"
          git add social-card.png caption.txt
          git commit -m "daily social card $(date -u +%F)" || echo "nothing to commit"
          git push
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Post to ContentStudio
        if: steps.guard.outputs.run == 'yes'
        env:
          CONTENTSTUDIO_API_KEY: ${{ secrets.CONTENTSTUDIO_API_KEY }}
          IMAGE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ env.SHA }}/social-card.png
          PUBLISH_TYPE: scheduled
          SCHEDULE_LEAD_MIN: "5"
        run: python post_card.py

      - name: Record today's post so later firings skip
        if: steps.guard.outputs.run == 'yes'
        run: |
          TODAY=$(TZ="America/New_York" date +%F)
          echo "$TODAY" > .last_post_date
          git config user.name "bannerman-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .last_post_date
          git commit -m "record daily post $TODAY" || echo "nothing to commit"
          git push || (git pull --rebase --autostash && git push)
