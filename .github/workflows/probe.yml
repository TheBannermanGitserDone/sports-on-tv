name: Probe data sources

# Manual only. Tests which sports feeds are reachable from a GitHub runner,
# after ESPN's site.api host began returning 403 to GitHub IP ranges.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe candidate sources
        run: python probe_sources.py
