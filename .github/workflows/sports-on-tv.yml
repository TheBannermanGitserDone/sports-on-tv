name: Sports on TV Today

# Refreshes thebannerman.ca/pages/sports-on-tv-today every morning (Pacific).
#
# generate_sports_tv.py is idempotent: it always rebuilds *today's* Pacific-date
# page and UPSERTs it into the one Shopify page, so running it more than once a
# day just republishes the same content. GitHub's scheduled runs are frequently
# delayed (sometimes by hours), which used to make the old exact-hour guard skip
# the whole day. We now publish on every firing and schedule several morning
# firings for redundancy, so a delayed or dropped cron no longer leaves the page
# stale.

on:
  schedule:
    - cron: "35 11 * * *"   # ~4:35 AM PDT / 3:35 AM PST
    - cron: "35 12 * * *"   # ~5:35 AM PDT / 4:35 AM PST
    - cron: "35 14 * * *"   # ~7:35 AM PDT / 6:35 AM PST  (backup)
    - cron: "35 16 * * *"   # ~9:35 AM PDT / 8:35 AM PST  (backup)
  workflow_dispatch: {}      # run it by hand from the Actions tab anytime

concurrency:
  group: sports-on-tv
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate & publish the page
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
        run: python generate_sports_tv.py
