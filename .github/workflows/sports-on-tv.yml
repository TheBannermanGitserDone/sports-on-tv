name: Sports on TV Today

# Publishes thebannerman.ca/pages/sports-on-tv-today every morning ~7:35 AM Eastern.
# GitHub cron is UTC and ignores DST, so we fire at both the EDT and EST offsets,
# plus two later backup firings in case GitHub delays or drops the morning run.
# The page script just republishes today's page (idempotent), so extra firings are
# harmless and there is no time guard that could silently skip.

on:
  schedule:
    - cron: "35 11 * * *"   # 7:35 AM EDT (summer)
    - cron: "35 12 * * *"   # 7:35 AM EST (winter)
    - cron: "35 15 * * *"   # backup (~11:35 AM ET)
    - cron: "35 17 * * *"   # backup (~1:35 PM ET)
  workflow_dispatch: {}

concurrency:
  group: sports-on-tv
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate & publish the page
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
        run: python generate_sports_tv.py
